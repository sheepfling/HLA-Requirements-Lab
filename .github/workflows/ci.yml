name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check scripts topics/_template topics/ieee/hla-1516.1-2025/build.py topics/ieee/hla-1516.2-2025/build.py
      - run: ruff format --check scripts topics/_template topics/ieee/hla-1516.1-2025/build.py topics/ieee/hla-1516.2-2025/build.py
      - run: python -m compileall -q scripts topics
      - run: python scripts/build.py list
